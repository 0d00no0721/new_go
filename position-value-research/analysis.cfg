# KataGo analysis 配置 —— 位置价值研究
# 基于 katago_configs/analysis_example.cfg 精简

# 日志（英文路径规避中文坑）
logDir = E:/katago_cache/pv_logs
logSearchInfo = false
logAllRequests = false
logAllResponses = false

# 报告视角：黑方
reportAnalysisWinratesAs = BLACK

# 搜索上限：每查询 200 visits（布局第一手足够精确）
maxVisits = 200

# 并行：8 个分析线程 × 8 搜索线程（RTX5060 OpenCL）
numAnalysisThreads = 8
numSearchThreadsPerAnalysisThread = 8
nnMaxBatchSize = 64

# NN 缓存
nnCacheSizePowerOfTwo = 23
nnMutexPoolSizePowerOfTwo = 17
# 关闭随机化：研究结果可复现
nnRandomize = false

# OpenCL tuner 缓存目录（复用 ban-selection 已调优的 tuner）
homeDataDir = E:/katago_cache

# 棋盘对称剪枝（19 路标准）
rootSymmetryPruning = true
