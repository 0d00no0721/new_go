# KataGo GTP 配置 — weighted-scoring 方向（最小集）
# 复用 E:/katago_cache 的 OpenCL tuner（28b c512 已调优）

logDir = E:/katago_cache/ws_tuner
logSearchInfo = false
logAllRequests = false
logAllResponses = false

# 搜索
numSearchThreads = 20
maxVisits = 200

# NN 缓存与 tuner
nnCacheSizePowerOfTwo = 23
nnMutexPoolSizePowerOfTwo = 17
nnRandomize = false
homeDataDir = E:/katago_cache

# 报告视角
reportAnalysisWinratesAs = BLACK

# 对弈行为
resignThreshold = -0.95
# 不允许 cleanup 阶段，简化
preventCleanupPhase = true
