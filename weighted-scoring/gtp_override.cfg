# GTP override 配置 — weighted-scoring 方向
# 基础配置用 E:\2026-01-07-win64-KataGo\katago_configs\default_gtp.cfg
# 本文件追加 weighted-scoring 专属覆盖

# 复用 E:/katago_cache 的 OpenCL tuner（28b c512 已调优）
homeDataDir = E:/katago_cache

# 搜索线程（RTX5060 OpenCL 推荐 20）
numSearchThreads = 20

# 关闭 NN 随机化，结果可复现
nnRandomize = false

# 限制搜索量以加速对弈验证（可调）
maxVisits = 200

# 强制贴目 7.5（标准中国贴目；标定数据不可信，见收敛报告_komi_utility校准.md §2）
# 忽略 GTP komi 命令，固定用此值
ignoreGTPAndForceKomi = 7.5
